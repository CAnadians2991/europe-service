# Netlify (team «EuropeService Sites»): Next.js runtime builds on Netlify's Linux image, so sharp (photo uploads) works.
[build]
  # never publish on an empty / unreachable Netlify Database
  command = "node scripts/check-netlify-db.mjs && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "24"
  NEXT_TELEMETRY_DISABLED = "1"

# Files from public/ are served by Netlify's CDN, which ignores next.config headers() for them and sends
# «max-age=0, must-revalidate» — every photo was re-checked on every page view.
# /media/v (vacancy photos): the file name carries a content hash (a new photo = a new name) → cached for a year.
# /media/c also holds a few named icons (poland.svg, viber.svg…) that could be replaced in place → 30 days.
# The patterns don't overlap on purpose: Netlify merges a header set by two matching rules.
[[headers]]
  for = "/media/v/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/media/c/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# The rest of the media (owner 2026-10-15: «фото й відео мають вантажитись моментально») — without these rules Netlify
# sent max-age=0 and every view re-checked every file. /media/hx and /media/r names are content hashes → a year;
# named files (team photos, review videos and covers, press, the vx folders) → 30 days.
[[headers]]
  for = "/media/hx/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/media/r/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/media/vx/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/media/team/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/media/press/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/reviews/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
