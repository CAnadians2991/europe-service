<!doctype html>
<html lang="uk">
<head><meta charset="utf-8"><meta name="robots" content="noindex, nofollow"><title>Europe Service forms</title></head>
<body>
<!-- Netlify Forms detection. The partnership form is filled on /spivpratsya (and its RU/EN/PL pages) and posted here by the
     server (src/lib/leads.ts toPartnerEmail); Netlify e-mails each submission to the owner with the subject «ПАРТНЕРСТВО». -->
<form name="partnership" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="partnership">
  <input type="hidden" name="subject">
  <input name="kind"><input name="name"><input name="phone"><input name="email"><input name="company"><input name="country">
  <textarea name="message"></textarea>
  <input name="page"><input name="lang"><input name="source"><input name="bot-field">
</form>
</body>
</html>
